<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Convai Modding Tool</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">
  <header class="bar">
    <span class="mark" aria-hidden="true"></span>
    <button class="brand" id="home-button" type="button">Convai Modding Tool</button>
    <span class="crumb" id="crumb">/ Starting</span>
    <span class="spacer"></span>
    <button class="account-button" id="account-button" type="button" hidden>
      <span class="account-avatar" id="account-avatar">?</span><span id="account-label">Sign in</span>
    </button>
    <button class="quiet" id="settings-button" type="button" hidden>Settings</button>
  </header>

  <main class="page" id="page" tabindex="-1"></main>

  <footer class="footer">
    <span id="status-version">Convai Modding Tool</span>
    <span aria-hidden="true">•</span>
    <span class="footer-hint">Projects are discovered beside this tool.</span>
    <span class="spacer"></span>
    <span id="status-right" role="status" aria-live="polite"></span>
  </footer>
</div>

<!-- Sign-in, the account menu and Settings are drawn here, over the page. -->
<div id="overlay"></div>

<script src="app.js"></script>
</body>
</html>
